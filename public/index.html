<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/home.css">
  <title>Hanyu</title>
</head>

<body>
  <main>
    <section class="section--settings" x-data="settings">
      <div class="settings-header">
        <a href="/edit">編集</a>
      </div>
      <div class="section-separator"></div>
      <div class="settings-groups">

        <div class="settings-group">
          <h2 class="settings-group__heading">モード選択</h2>
          <div class="settings-group__content">
            <label class="settings-group__radio">
              <input type="radio" name="mode" value="input" x-model="settings.mode">
              <span>ピンイン入力</span>
            </label>
            <label class="settings-group__radio">
              <input type="radio" name="mode" value="card" x-model="settings.mode">
              <span>暗記カード</span>
            </label>
          </div>
        </div>
        <div class="settings-group">
          <h2 class="settings-group__heading">中国語読み上げ</h2>
          <div class="settings-group__content">
            <label class="settings-group__radio">
              <input type="radio" name="speak" value="true" x-model.boolean="settings.speak">
              <span>読み上げあり</span>
            </label>
            <label class="settings-group__radio">
              <input type="radio" name="speak" value="false" x-model.boolean="settings.speak">
              <span>読み上げなし</span>
            </label>
          </div>
        </div>
      </div>
    </section>
    <section class="section--categories" x-data="categories">
      <template x-for="vocab in vocabulary" :key="vocab.id">
        <a class="vocabulary-category" :href="vocab.count === 0 ? null : `/study?id=${vocab.id}`" :class="{ 'disable': vocab.count === 0 }">
          <span>
            <span x-text="vocab.name"></span> (<span x-text="vocab.count"></span>問)
          </span>
        </a>
      </template>
    </section>
  </main>

  <script type="module" src="/js/common.js" defer></script>
  <script type="module" src="/js/home.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</body>

</html>
