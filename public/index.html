<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/home.css">
  <title>Hanyu</title>
</head>

<body>
  <main>
    <section class="section--settings" x-data="settings">
      <div class="settings-group">
        <h2 class="settings-group__heading">モード選択</h2>
        <div class="settings-group__content">
          <label>
            <input type="radio" name="mode" value="input" x-model="settings.mode">
            <span>ピンイン入力</span>
          </label>
          <label>
            <input type="radio" name="mode" value="card" x-model="settings.mode">
            <span>暗記カード</span>
          </label>
        </div>
      </div>
    </section>
    <section class="section--categories" x-data="categories">
      <template x-for="vocab in vocabulary" :key="vocab.id">
        <a :href="`/study?id=${vocab.id}`">
          <div x-text="vocab.name"></div>
        </a>
      </template>
    </section>
  </main>

  <script type="module" src="/js/common.js" defer></script>
  <script type="module" src="/js/home.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</body>

</html>
