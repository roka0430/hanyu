<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/study.css">
  <title>Hanyu | Study</title>
</head>

<body>
  <main>
    <section class="section--study" x-data="study">
      <template x-if="mode === 'input'">
        <div class="study study--input">
          <div class="study__question">
            <div class="study__question-number">1 / 10</div>
            <div class="study__question-ja">中国語</div>
            <div class="study__question-cn text--chinese">汉语</div>
            <div class="study__question-pinyin text--pinyin">Hànyǔ</div>
          </div>
          <div class="study__answer">
            <input type="text" spellcheck="false">
          </div>
        </div>
      </template>
      <template x-if="mode === 'card'">
        <div class="study study--card">
          card
        </div>
      </template>
    </section>
  </main>

  <script type="module" src="/js/common.js" defer></script>
  <script type="module" src="/js/study.js" defer></script>
</body>

</html>
