<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/study.css">
  <title>Hanyu | Study</title>
</head>

<body>
  <main>
    <section class="section--study" :class="{ 'is-correct': !isAnswering }" x-data="study">
      <template x-if="settings.mode === 'input'">
        <div class="study study--input">
          <div class="study__question">
            <div class="study__question-number" x-text="`${index + 1} / ${words?.words.length}`"></div>
            <div class="study__question-ja" x-text="currentWord.ja"></div>
            <div class="study__question-cn text--chinese" x-text="isAnswerVisible ? currentWord.cn : '--'" @click="speak(currentWord.cn)"></div>
            <div class="study__question-pinyin text--pinyin" x-text="isAnswerVisible ? convertPinyin(currentWord.pinyin) : '--'"></div>
          </div>
          <div class="study__answer">
            <input type="text" x-model="answer" @keydown="keydownInput(event)" spellcheck="false" autofocus>
          </div>
        </div>
      </template>
      <template x-if="settings.mode === 'card'">
        <div class="study study--card" @keydown.window="cardKeydown(event)">
          <div class="study__question">
            <div class="study__question-number" x-text="`${index + 1} / ${words?.words.length}`"></div>
            <div class="study__question-ja" x-text="currentWord.ja"></div>
            <div class="study__question-cn text--chinese" x-text="isAnswerVisible ? currentWord.cn : '--'" @click="speak(currentWord.cn)"></div>
            <div class="study__question-pinyin text--pinyin" x-text="isAnswerVisible ? convertPinyin(currentWord.pinyin) : '--'"></div>
          </div>
        </div>
      </template>
    </section>
  </main>

  <script type="module" src="/js/common.js" defer></script>
  <script type="module" src="/js/study.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
